name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    name: Publish ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            args: ""
          - label: macOS universal
            platform: macos-latest
            args: "--target universal-apple-darwin"
          - label: Linux x64
            platform: ubuntu-22.04
            args: ""

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS universal Rust targets
        if: matrix.label == 'macOS universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release metadata
        shell: bash
        run: node scripts/validate-release.mjs "${GITHUB_REF_NAME#v}" --require-changelog

      - name: Build release body from repository docs
        id: release_notes
        shell: bash
        run: |
          node scripts/build-release-body.mjs "${GITHUB_REF_NAME#v}" > release-body.md
          delimiter="release-body-$(node -e "process.stdout.write(require('node:crypto').randomUUID())")"
          {
            printf 'body<<%s\n' "$delimiter"
            cat release-body.md
            printf '\n%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Validate macOS updater signing secrets
        if: matrix.label == 'macOS universal'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; exit 1; }

      - name: Build app and upload release assets
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign the macOS build (identity "-") so Apple Silicon can run it
          # without a "damaged" error. This is not Apple notarization, so Gatekeeper
          # still prompts on first launch; the bundled helper script clears that.
          APPLE_SIGNING_IDENTITY: ${{ matrix.label == 'macOS universal' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.label == 'macOS universal' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.label == 'macOS universal' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "No.1 Markdown Editor ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true

      - name: Verify macOS updater release assets
        if: matrix.label == 'macOS universal'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/updater-assets"
          gh release download "${{ github.ref_name }}" --pattern "latest.json" --pattern "*.app.tar.gz.sig" --dir "$RUNNER_TEMP/updater-assets"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = process.env.RUNNER_TEMP + "/updater-assets";
            const latest = JSON.parse(fs.readFileSync(path.join(root, "latest.json"), "utf8"));
            const targets = ["darwin-aarch64", "darwin-x86_64"];
            const entries = targets.map((target) => latest.platforms?.[target]);
            if (entries.some((entry) => !entry?.signature || !entry.url?.endsWith(".app.tar.gz"))) process.exit(1);
            if (entries[0].url !== entries[1].url) process.exit(1);
            if (!fs.readdirSync(root).some((name) => name.endsWith(".app.tar.gz.sig"))) process.exit(1);
          '

      - name: Package macOS first-launch helper
        if: matrix.label == 'macOS universal'
        shell: bash
        run: |
          chmod +x "scripts/macos/Open-No1-Markdown-Editor.command"
          ( cd scripts/macos && zip -X "$GITHUB_WORKSPACE/macOS-First-Launch-Helper.zip" "Open-No1-Markdown-Editor.command" )

      - name: Upload macOS first-launch helper
        if: matrix.label == 'macOS universal'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "macOS-First-Launch-Helper.zip" --clobber
