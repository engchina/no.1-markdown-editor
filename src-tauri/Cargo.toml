[package]
name = "no1-markdown-editor"
version = "0.27.11"
description = "No.1 Markdown Editor — Free Forever"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4.44"
ring = "0.17.14"
sha2 = "0.10.9"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
semver = "1"
tokio = { version = "1", features = ["rt", "sync"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[target."cfg(any(target_os = \"macos\", windows))".dependencies]
xcap = "=0.8.0"

[target."cfg(windows)".dependencies]
webview2-com = "0.38"
# WindowsAndMessaging parks the editor without activation; Accessibility powers
# PixPin-style control detection beneath the screenshot overlay.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(target_os = \"macos\")".dependencies]
tauri-plugin-updater = "2.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKNavigation", "WKPDFConfiguration", "block2"] }
block2 = "0.6"

[target."cfg(target_os = \"linux\")".dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
glib = "0.18"
# `file_chooser` is enabled solely to pull ashpd's optional `serde_repr` dep:
# ashpd 0.13.12's `screenshot` module uses serde_repr unconditionally but the
# `screenshot` feature (`screenshot = []`) fails to enable it, breaking the Linux
# build. `file_chooser = ["dep:serde_repr"]` is the lightest fix (pure DBus, no
# pipewire). Revisit if a fixed ashpd release lands.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot", "file_chooser"] }
x11rb = { version = "0.13", default-features = false, features = ["image", "randr"] }

[dev-dependencies]
x11rb = { version = "0.13", default-features = false, features = ["image", "randr"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
